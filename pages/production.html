<!-- 
PRODUCTION ENTRY FORM
 -->

<div class="form-card">

    <div class="form-header">
        <h2>
            <i class="fa-solid fa-industry"></i>
            Record Production
        </h2>
    </div>

    <form class="production-form">

        <!-- Row 1 -->

        <div class="form-group">
            <label>Production Date</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Batch No.</label>
            <input type="text" placeholder="BATCH-001">
        </div>

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" placeholder="Men Casual Shoes">
        </div>

        <div class="form-group">
            <label>Supervisor</label>
            <input type="text" placeholder="Supervisor Name">
        </div>

        <div class="form-group">
            <label>Quantity Produced</label>
            <input type="number" placeholder="0">
        </div>

        <!-- Row 2 -->

        <div class="form-group">
            <label>Material Used</label>
            <input type="text" placeholder="Leather, Rubber Sole">
        </div>

        <div class="form-group">
            <label>Machine</label>

            <select>
                <option>Cutting Machine</option>
                <option>Stitching Machine</option>
                <option>Moulding Machine</option>
                <option>Finishing Machine</option>
            </select>

        </div>

        <div class="form-group">
            <label>Status</label>

            <select>
                <option>Completed</option>
                <option>In Progress</option>
                <option>Pending</option>
            </select>

        </div>

        <div class="form-group">
            <label>Defective Qty</label>
            <input type="number" placeholder="0">
        </div>

        <div class="form-group">
            <label>Remarks</label>
            <input type="text" placeholder="Production Notes">
        </div>

    </form>

    <div class="form-footer">

        <button class="btn-primary">
            <i class="fa-solid fa-plus"></i>
            Add Production Record
        </button>

    </div>

</div>
